services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - DATABASE_URL
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
    expose:
      - "3000"
    

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config: